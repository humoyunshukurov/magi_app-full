# Standalone package, deliberately not a member of the magi_app Cargo workspace it happens
# to sit under - this empty table is what tells Cargo that.
[workspace]

[package]
name = "magi-server"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "LicenseRef-Proprietary"
authors = ["markhabo labs"]

[lib]
doctest = false

[[bin]]
name = "magi-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "10", features = ["chrono-impl"] }

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.16"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
